name: Solidity security

on:
  push:
    paths:
      - ".github/workflows/solidity-security.yml"
      - ".github/workflows/solidity-campaign.yml"
      - ".solhint.json"
      - "contracts/**"
      - "app/src/config/robinhood-mainnet.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-contract-coverage.mjs"
      - "scripts/check-invariant-sensitivity.mjs"
      - "scripts/run-solidity-campaign.mjs"
      - "scripts/check-contract-security.mjs"
      - "scripts/compile-contracts.mjs"
      - "scripts/deploy-robinhood-testnet.mjs"
      - "scripts/generate-contract-abis.mjs"
      - "scripts/verify-mainnet-routing.mjs"
      - "scripts/lib/mainnet-routing*"
      - "scripts/lib/testnet-routing*"
      - "scripts/fixtures/**"
      - "packages/generated/**"
  pull_request:
    paths:
      - ".github/workflows/solidity-security.yml"
      - ".github/workflows/solidity-campaign.yml"
      - ".solhint.json"
      - "contracts/**"
      - "app/src/config/robinhood-mainnet.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-contract-coverage.mjs"
      - "scripts/check-invariant-sensitivity.mjs"
      - "scripts/run-solidity-campaign.mjs"
      - "scripts/check-contract-security.mjs"
      - "scripts/compile-contracts.mjs"
      - "scripts/deploy-robinhood-testnet.mjs"
      - "scripts/generate-contract-abis.mjs"
      - "scripts/verify-mainnet-routing.mjs"
      - "scripts/lib/mainnet-routing*"
      - "scripts/lib/testnet-routing*"
      - "scripts/fixtures/**"
      - "packages/generated/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidity-security-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_FUZZ_SEED: "0x9f4f6d84b3d23c0d920c3ab72e86e10b72b65a10d6e2c4605aeb1ec8b337c921"
  FOUNDRY_VERSION: "v1.7.1"

jobs:
  solidity-security:
    name: Solidity security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22.18.0"
          package-manager-cache: false

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          test "$(corepack pnpm --version)" = "11.17.0"

      - name: Install JavaScript and Solidity dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - name: Verify pinned toolchain
        shell: bash
        run: |
          forge --version
          forge --version | grep -F "forge Version: 1.7.1"
          node -e 'const version = require("solc").version(); if (!version.startsWith("0.8.26+")) { throw new Error(`unexpected solc ${version}`); }'

      - name: Check Solidity formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Run contract security gate
        run: corepack pnpm contracts:security

      - name: Generate fresh TypeScript ABIs
        run: corepack pnpm contracts:abi

      - name: Typecheck generated package
        run: corepack pnpm --filter @onchaintradedfunds/generated typecheck

      - name: Run full Foundry suite
        working-directory: contracts
        run: forge test --fuzz-seed "$CI_FUZZ_SEED" --summary

      - name: Run real V4 integration suite
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: integration
        run: >-
          forge test
          --match-path test/OTFLaunchV4Integration.t.sol
          --fuzz-seed "$CI_FUZZ_SEED"
          --summary

      - name: Validate pinned testnet router configuration
        run: node --test scripts/lib/testnet-routing.test.mjs

      - name: Validate mainnet fork guards
        run: node --test scripts/lib/mainnet-routing.test.mjs

      - name: Run pinned Robinhood mainnet fork suite
        run: corepack pnpm contracts:validate:mainnet-routing

      - name: Run V4 launch invariant suite
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: integration
          FOUNDRY_INVARIANT_RUNS: "128"
          FOUNDRY_INVARIANT_DEPTH: "64"
        run: >-
          forge test
          --match-path test/OTFLaunchV4Invariant.t.sol
          --fuzz-seed "$CI_FUZZ_SEED"
          --summary

      - name: Verify invariant failure sensitivity in both profiles
        run: node scripts/check-invariant-sensitivity.mjs

      - name: Generate advisory production coverage summary
        run: corepack pnpm contracts:coverage

      - name: Preserve coverage and sensitivity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidity-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/invariant-sensitivity/
            test-results/solidity-coverage.lcov
            contracts/cache/invariant/
            contracts/cache/fuzz/
          retention-days: 30
