name: Launch scheduled jobs

on:
  schedule:
    - cron: "17,47 * * * *"
    - cron: "42 2 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        default: both
        type: choice
        options:
          - both
          - prices
          - x-evidence

permissions:
  contents: read

concurrency:
  group: launch-scheduled-jobs
  cancel-in-progress: false

jobs:
  prices:
    if: github.event.schedule == '17,47 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'prices' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAUNCH_SITE_URL: ${{ vars.LAUNCH_SITE_URL }}
      CRON_SECRET: ${{ secrets.LAUNCH_CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: test -n "$LAUNCH_SITE_URL" && test -n "$CRON_SECRET"
      - name: Capture asset prices
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 3 --retry-delay 5 --max-time 30
          --header "Authorization: Bearer $CRON_SECRET"
          --header "Accept: application/json"
          "${LAUNCH_SITE_URL%/}/api/jobs/prices"

  x-evidence:
    if: github.event.schedule == '42 2 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'x-evidence' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LAUNCH_SITE_URL: ${{ vars.LAUNCH_SITE_URL }}
      CRON_SECRET: ${{ secrets.LAUNCH_CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: test -n "$LAUNCH_SITE_URL" && test -n "$CRON_SECRET"
      - name: Recheck public X evidence
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 3 --retry-delay 5 --max-time 300
          --header "Authorization: Bearer $CRON_SECRET"
          --header "Accept: application/json"
          "${LAUNCH_SITE_URL%/}/api/jobs/x-evidence"
