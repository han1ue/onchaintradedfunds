name: Launch X evidence recheck

on:
  schedule:
    # Bounded launch window. The endpoint uses the database competition window as the authority.
    # GitHub cron has no year field, so the runtime cutoff below also prevents future-year calls.
    - cron: "42 2 20-31 8 *"
    - cron: "42 2 1-30 9 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-x-evidence
  cancel-in-progress: false

jobs:
  recheck-x-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LAUNCH_SITE_URL: ${{ vars.LAUNCH_SITE_URL }}
      CRON_SECRET: ${{ secrets.LAUNCH_CRON_SECRET }}
      COMPETITION_ENDS_AT: "2026-10-01T00:00:00Z"
    steps:
      - name: Check competition window
        id: competition-window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] ||
             [[ "$(date -u +%s)" -lt "$(date -u -d "$COMPETITION_ENDS_AT" +%s)" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate configuration
        if: steps.competition-window.outputs.active == 'true'
        run: test -n "$LAUNCH_SITE_URL" && test -n "$CRON_SECRET"
      - name: Recheck public X evidence
        if: steps.competition-window.outputs.active == 'true'
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 3 --retry-delay 5 --max-time 300
          --header "Authorization: Bearer $CRON_SECRET"
          --header "Accept: application/json"
          "${LAUNCH_SITE_URL%/}/api/jobs/x-evidence"
