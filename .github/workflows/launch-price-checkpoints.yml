name: Launch price checkpoints

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-price-checkpoints
  cancel-in-progress: false

jobs:
  capture-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAUNCH_SITE_URL: ${{ vars.LAUNCH_SITE_URL }}
      CRON_SECRET: ${{ secrets.LAUNCH_CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: test -n "$LAUNCH_SITE_URL" && test -n "$CRON_SECRET"
      - name: Capture asset prices
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 3 --retry-delay 5 --max-time 30
          --header "Authorization: Bearer $CRON_SECRET"
          --header "Accept: application/json"
          "${LAUNCH_SITE_URL}/api/jobs/prices"
