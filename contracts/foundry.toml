[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
allow_paths = ["../node_modules"]
remappings = ["@openzeppelin/=../node_modules/@openzeppelin/"]
solc_version = "0.8.36"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
extra_output = ["storageLayout"]
# OpenZeppelin 5.6.1 uses a local named `error`; solc 0.8.36 emits the upstream-only
# future-keyword warning even when linting this repository's source directory.
ignored_error_codes = [6335]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
